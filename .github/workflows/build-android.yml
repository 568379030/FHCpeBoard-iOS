name: build-and-test-android
on:
  push:
    branches: [android-air6-sample]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check task behavior
        run: node test/adapter.tasks.test.js
      - name: Build signed debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator cold-start test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p android-test
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.fhcpeboard.air6sample/.MainActivity
            sleep 12
            adb logcat -d > android-test/logcat.txt
            adb exec-out screencap -p > android-test/startup.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml android-test/window.xml
            grep 'PAGE_READY' android-test/logcat.txt
            if grep -E 'FATAL EXCEPTION|LAN bootstrap failed|启动失败' android-test/logcat.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIR6-Android-sample54
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-test/
