name: Build AIR6 Local APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate debug keystore for signing
        run: |
          keytool -genkeypair -v -keystore app/release.jks \
            -alias air6local -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass air6local123 -keypass air6local123 \
            -dname "CN=FHCpeBoard AIR6 Local, OU=Local, O=FHCpeBoard, L=NA, ST=NA, C=CN"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: app/release.jks
          KEYSTORE_PASSWORD: air6local123
          KEY_ALIAS: air6local
          KEY_PASSWORD: air6local123
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"
          ls -lh "$APK"

      - name: Rename APK
        run: |
          cp "${{ steps.apk.outputs.path }}" "FHCpeBoard-AIR6-local-1.4.3-local-52.apk"
          ls -lh FHCpeBoard-AIR6-local-1.4.3-local-52.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FHCpeBoard-AIR6-local-APK
          path: FHCpeBoard-AIR6-local-1.4.3-local-52.apk
          if-no-files-found: error
